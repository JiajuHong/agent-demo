<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList 任务管理器</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 欢迎信息区域 -->
        <div class="welcome-section" id="welcomeSection">
            <h1 id="welcomeMessage">hello world</h1>
            <p class="welcome-subtitle">欢迎使用 TodoList 任务管理器</p>
        </div>

        <!-- 主应用区域 -->
        <div class="app-container">
            <!-- 头部区域 -->
            <header class="app-header">
                <div class="header-content">
                    <h1><i class="fas fa-tasks"></i> TodoList</h1>
                    <p class="app-description">高效管理您的日常任务</p>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">总任务</span>
                        <span class="stat-value" id="totalTasks">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">已完成</span>
                        <span class="stat-value" id="completedTasks">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">待完成</span>
                        <span class="stat-value" id="pendingTasks">0</span>
                    </div>
                </div>
            </header>

            <!-- 添加任务区域 -->
            <div class="add-task-section">
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="输入新任务..." maxlength="100">
                    <select id="prioritySelect">
                        <option value="low">低优先级</option>
                        <option value="medium" selected>中优先级</option>
                        <option value="high">高优先级</option>
                    </select>
                    <button id="addTaskBtn" class="btn-primary">
                        <i class="fas fa-plus"></i> 添加任务
                    </button>
                </div>
                <div class="input-hint">
                    <i class="fas fa-info-circle"></i> 最多可输入100个字符，按Enter键快速添加
                </div>
            </div>

            <!-- 过滤和搜索区域 -->
            <div class="filter-section">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">
                        <i class="fas fa-list"></i> 全部任务
                    </button>
                    <button class="filter-btn" data-filter="pending">
                        <i class="fas fa-clock"></i> 待完成
                    </button>
                    <button class="filter-btn" data-filter="completed">
                        <i class="fas fa-check-circle"></i> 已完成
                    </button>
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="搜索任务...">
                </div>
            </div>

            <!-- 任务列表区域 -->
            <div class="tasks-container">
                <div class="tasks-header">
                    <h2><i class="fas fa-tasks"></i> 任务列表</h2>
                    <div class="tasks-count" id="tasksCount">0 个任务</div>
                </div>
                
                <div class="tasks-list" id="tasksList">
                    <!-- 任务项将通过JavaScript动态生成 -->
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>暂无任务</h3>
                        <p>添加您的第一个任务开始管理</p>
                    </div>
                </div>
            </div>

            <!-- 操作按钮区域 -->
            <div class="action-buttons">
                <button id="clearCompletedBtn" class="btn-secondary">
                    <i class="fas fa-trash-alt"></i> 清除已完成
                </button>
                <button id="exportTasksBtn" class="btn-secondary">
                    <i class="fas fa-download"></i> 导出任务
                </button>
                <button id="importTasksBtn" class="btn-secondary">
                    <i class="fas fa-upload"></i> 导入任务
                </button>
                <button id="clearAllBtn" class="btn-danger">
                    <i class="fas fa-broom"></i> 清空所有
                </button>
            </div>

            <!-- 底部信息 -->
            <footer class="app-footer">
                <p>数据自动保存在浏览器本地存储中</p>
                <p class="footer-hint">
                    <i class="fas fa-sync-alt"></i> 刷新页面不会丢失数据
                </p>
            </footer>
        </div>
    </div>

    <!-- 编辑任务模态框 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> 编辑任务</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editTaskTitle">任务标题</label>
                    <input type="text" id="editTaskTitle" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="editPrioritySelect">优先级</label>
                    <select id="editPrioritySelect">
                        <option value="low">低优先级</option>
                        <option value="medium">中优先级</option>
                        <option value="high">高优先级</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary close-modal">取消</button>
                <button id="saveEditBtn" class="btn-primary">保存更改</button>
            </div>
        </div>
    </div>

    <!-- 导入任务模态框 -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-upload"></i> 导入任务</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="importText">粘贴导出的任务数据</label>
                    <textarea id="importText" rows="6" placeholder="请粘贴之前导出的JSON数据..."></textarea>
                </div>
                <div class="form-hint">
                    <i class="fas fa-info-circle"></i> 导入会覆盖当前所有任务，请谨慎操作
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary close-modal">取消</button>
                <button id="confirmImportBtn" class="btn-primary">确认导入</button>
            </div>
        </div>
    </div>

    <!-- 确认对话框 -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-triangle"></i> 确认操作</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage">您确定要执行此操作吗？</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary close-modal">取消</button>
                <button id="confirmActionBtn" class="btn-danger">确认</button>
            </div>
        </div>
    </div>

    <!-- 通知消息 -->
    <div class="notification" id="notification">
        <div class="notification-content">
            <i class="fas fa-check-circle"></i>
            <span id="notificationMessage">操作成功</span>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
