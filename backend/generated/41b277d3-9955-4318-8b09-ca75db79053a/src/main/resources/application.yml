server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: word-master
  
  datasource:
    url: jdbc:mysql://localhost:3306/word_master?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false
  
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

app:
  jwt:
    secret: word-master-secret-key-2023-spring-boot-jwt-token
    expiration: 86400000 # 24 hours in milliseconds
    refresh-expiration: 604800000 # 7 days in milliseconds
  
  security:
    allowed-origins: http://localhost:3000,http://localhost:8080
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: *
  
  learning:
    daily-goal: 20
    review-intervals: 1,3,7,14,30
    mastery-threshold: 5
    max-difficulty: 10
  
  cache:
    word-cache-ttl: 3600 # 1 hour in seconds
    user-cache-ttl: 1800 # 30 minutes in seconds

logging:
  level:
    com.wordmaster: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/word-master.log
    max-size: 10MB
    max-history: 30